<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raccoon Quant Citadel</title>

  <!-- Load everything as plain scripts — works from any local file or content:// URL -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide-react/dist/umd/lucide-react.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020617; }
    #root { width: 100%; height: 100%; }

    @keyframes spin    { to   { transform: rotate(360deg);  } }
    @keyframes unspin  { to   { transform: rotate(-360deg); } }
    @keyframes pulse35 { 0%,100% { opacity:.85; transform:translate(-50%,-50%) scale(1);    }
                         50%      { opacity:1;   transform:translate(-50%,-50%) scale(1.08); } }
    @keyframes blink   { 0%,100% { opacity:.4; } 50% { opacity:.75; } }
    @keyframes slidein { from { transform:translateX(340px); opacity:0; }
                         to   { transform:translateX(0);     opacity:1; } }
    @keyframes fadein  { from { opacity:0; transform:translateX(10px); }
                         to   { opacity:1; transform:translateX(0);    } }
    @keyframes dotblink{ 0%,100%{opacity:.5;} 50%{opacity:1;} }

    .spin18  { animation: spin    18s linear     infinite; }
    .spin6   { animation: spin     6s linear     infinite; }
    .unspin9 { animation: unspin   9s linear     infinite; }
    .blink-orb { animation: blink  2s ease-in-out infinite; }
    .blink-creature { animation: blink 2s ease-in-out infinite; }
    .dot-pulse  { animation: dotblink 1.5s ease-in-out infinite; }
    .panel-slide { animation: slidein .35s cubic-bezier(.22,.68,0,1.2) forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

    // ── Sample Data ──────────────────────────────────────────────────────────

    const SAMPLE_DATA = {

        ],

          "[DAY 47] Memory #0388 — score 0.31 — QUARANTINE — contamination 0.71",

      observatory: {

      },
      strategy_nursery: {

        stats: [
          { label: "Nursery Residents", value: "2"        },
          { label: "Graduated Today",   value: "1"        },
          { label: "Lane Conflicts",    value: "0"        },
          { label: "Avg Incubation",    value: "6.2 days" },
        ],
        log: [
          "[DAY 47] Ghost_Riser_v1 — entered nursery — lane: calm_volatile_reversal",
          "[DAY 47] Drift_Ember — day 4 incubation — lane check: clear",
          "[DAY 46] Momentum_Sneak — graduated nursery → ACTIVE_TRIAL",
          "[DAY 45] Ghost_Riser_v1 — lane assignment: storm_false_followthrough",
          "[DAY 44] Drift_Ember — entered nursery — lane: loud_calm_continuation",
        ],
        glow:"#84cc16", textColor:"#a3e635", bg:"rgba(132,204,22,.08)",
      },
    };

    const ROOMS = [
      { id:"champion_gate",    label:"Champion Gate",    Icon:Trophy,        x:50, y:9,  glow:"#f59e0b", text:"#fbbf24" },
      { id:"collision_court",  label:"Collision Court",  Icon:Scale,         x:14, y:26, glow:"#8b5cf6", text:"#a78bfa" },
      { id:"door_guard",       label:"Door Guard",       Icon:Shield,        x:86, y:26, glow:"#06b6d4", text:"#22d3ee" },
      { id:"risk_governor",    label:"Risk Governor",    Icon:AlertTriangle, x:7,  y:52, glow:"#f97316", text:"#fb923c" },
      { id:"wisdom_archive",   label:"Wisdom Archive",   Icon:BookOpen,      x:93, y:52, glow:"#10b981", text:"#34d399" },
      { id:"quarantine_wing",  label:"Quarantine Wing",  Icon:Lock,          x:14, y:78, glow:"#f43f5e", text:"#fb7185" },
      { id:"observatory",      label:"Observatory",      Icon:Eye,           x:86, y:78, glow:"#0ea5e9", text:"#38bdf8" },
      { id:"strategy_nursery", label:"Strategy Nursery", Icon:Leaf,          x:50, y:91, glow:"#84cc16", text:"#a3e635" },
    ];

    const CREATURES = [
      { id:"bold",     label:"Bold_Cautious_v2",    status:"CHAMPION",     color:"#f59e0b", x:38, y:38, emoji:"🦝" },
      { id:"careful",  label:"Careful_Garden",       status:"ACTIVE",       color:"#10b981", x:56, y:42, emoji:"🌱" },
      { id:"chaos",    label:"Chaos_Snack",          status:"ACTIVE_TRIAL", color:"#8b5cf6", x:45, y:58, emoji:"⚡" },
      { id:"stone",    label:"Stone_Raccoon",         status:"BASELINE",     color:"#64748b", x:60, y:55, emoji:"🪨" },
      { id:"reckless", label:"Reckless_Firecracker", status:"QUARANTINED",  color:"#f43f5e", x:40, y:62, emoji:"🔒" },
    ];

    // ── Hex Glyph ─────────────────────────────────────────────────────────────

    function HexGlyph({ color, size }) {
      return (
        <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
          <polygon points="20,2 36,11 36,29 20,38 4,29 4,11"
            stroke={color} strokeWidth="1.2" fill="none" opacity="0.6" />
          <polygon points="20,8 31,14 31,26 20,32 9,26 9,14"
            stroke={color} strokeWidth="0.7" fill="none" opacity="0.35" />
          <circle cx="20" cy="20" r="3" fill={color} opacity="0.5" />
        </svg>
      );
    }

    // ── Sophon Orb ────────────────────────────────────────────────────────────

    function SophonOrb() {
      return (
        <div style={{
          position:"absolute", left:"50%", top:"50%",
          transform:"translate(-50%,-50%)", pointerEvents:"none", zIndex:10,
        }}>
          <div className="spin18" style={{ position:"relative", width:96, height:96 }}>
            <div style={{
              position:"absolute", inset:0, borderRadius:"50%",
              border:"1px solid rgba(99,102,241,.4)",
            }} />
            <div className="spin6" style={{ position:"absolute", inset:8 }}>
              <div style={{
                position:"absolute", top:0, left:"50%", transform:"translateX(-50%)",
                width:6, height:6, borderRadius:"50%", background:"#818cf8",
                boxShadow:"0 0 6px #818cf8",
              }} />
            </div>
            <div className="unspin9" style={{ position:"absolute", inset:16 }}>
              <div style={{
                position:"absolute", top:0, left:"50%", transform:"translateX(-50%)",
                width:4, height:4, borderRadius:"50%", background:"#a78bfa",
                boxShadow:"0 0 4px #a78bfa",
              }} />
            </div>
          </div>

          <div style={{
            position:"absolute", top:"50%", left:"50%",
            width:40, height:40, borderRadius:"50%",
            background:"linear-gradient(135deg,#4f46e5,#7c3aed,#6d28d9)",
            boxShadow:"0 0 24px #6366f1, 0 0 8px #a78bfa",
            display:"flex", alignItems:"center", justifyContent:"center",
            animation:"pulse35 3.5s ease-in-out infinite",
          }}>
            <span style={{
              color:"#fff", fontSize:11, fontWeight:700,
              letterSpacing:3, fontFamily:"monospace", userSelect:"none",
            }}>S</span>
          </div>

          <div style={{
            position:"absolute", bottom:-22, left:"50%", transform:"translateX(-50%)",
            whiteSpace:"nowrap", fontSize:10, color:"#818cf8",
            fontFamily:"monospace", letterSpacing:4, opacity:.7,
          }}>SOPHON</div>
        </div>
      );
    }

    // ── Creature ──────────────────────────────────────────────────────────────

    function Creature({ creature }) {
      const [pos, setPos] = useState({ x: creature.x, y: creature.y });
      const targetRef = useRef({ x: creature.x, y: creature.y });
      const frameRef = useRef(null);

      useEffect(() => {
        if (creature.status === "QUARANTINED") return;
        const wander = () => {
          targetRef.current = {
            x: creature.x + (Math.random() - .5) * 12,
            y: creature.y + (Math.random() - .5) * 12,
          };
        };
        wander();
        const id = setInterval(wander, 3000 + Math.random() * 2000);
        return () => clearInterval(id);
      }, []);

      useEffect(() => {
        if (creature.status === "QUARANTINED") return;
        const tick = () => {
          setPos(p => ({
            x: p.x + (targetRef.current.x - p.x) * .03,
            y: p.y + (targetRef.current.y - p.y) * .03,
          }));
          frameRef.current = requestAnimationFrame(tick);
        };
        frameRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(frameRef.current);
      }, []);

      return (
        <div
          className={creature.status === "QUARANTINED" ? "blink-creature" : ""}
          title={`${creature.label} — ${creature.status}`}
          style={{
            position:"absolute", pointerEvents:"none", userSelect:"none",
            left:`${pos.x}%`, top:`${pos.y}%`, transform:"translate(-50%,-50%)",
            display:"flex", flexDirection:"column", alignItems:"center", gap:2,
          }}
        >
          <span style={{ fontSize:14, lineHeight:1 }}>{creature.emoji}</span>
          <span style={{
            fontSize:8, fontFamily:"monospace", fontWeight:700,
            padding:"0 3px", borderRadius:2,
            color:creature.color, textShadow:`0 0 6px ${creature.color}`,
          }}>{creature.id.toUpperCase()}</span>
        </div>
      );
    }

    // ── Room Node ─────────────────────────────────────────────────────────────

    function RoomNode({ room, isActive, onClick }) {
      const [hov, setHov] = useState(false);
      const on = isActive || hov;
      const { Icon } = room;

      return (
        <button
          onClick={onClick}
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => setHov(false)}
          style={{
            position:"absolute",
            left:`${room.x}%`, top:`${room.y}%`,
            transform:`translate(-50%,-50%) scale(${hov ? 1.1 : 1})`,
            transition:"transform .15s ease",
            display:"flex", flexDirection:"column", alignItems:"center", gap:4,
            background:"none", border:"none", cursor:"pointer", padding:4,
          }}
        >
          <div style={{
            width:44, height:44, borderRadius:8,
            border:`2px solid ${on ? room.glow : "#334155"}`,
            background: on ? `${room.glow}18` : "rgba(15,23,42,.9)",
            display:"flex", alignItems:"center", justifyContent:"center",
            boxShadow: isActive ? `0 0 18px ${room.glow}60` : "none",
            transition:"border-color .2s, background .2s, box-shadow .2s",
          }}>
            <Icon size={20} color={on ? room.text : "#64748b"}
              style={isActive ? { filter:`drop-shadow(0 0 4px ${room.glow})` } : {}} />
          </div>
          <span style={{
            fontSize:9, fontFamily:"monospace", fontWeight:600,
            letterSpacing:1, whiteSpace:"nowrap",
            color: on ? room.text : "#475569",
            transition:"color .15s",
          }}>{room.label.toUpperCase()}</span>
          {isActive && (
            <div style={{
              width:6, height:6, borderRadius:"50%",
              background:room.glow, boxShadow:`0 0 6px ${room.glow}`,
            }} />
          )}
        </button>
      );
    }

    // ── Side Panel ────────────────────────────────────────────────────────────

    function SidePanel({ roomId, onClose }) {
      const data = SAMPLE_DATA[roomId];
      if (!data) return null;

      return (
        <div className="panel-slide" style={{
          position:"absolute", right:0, top:0, height:"100%", width:320,
          zIndex:30, background:"rgba(2,6,23,.97)",
          borderLeft:`2px solid ${data.glow}`,
          boxShadow:`-8px 0 32px ${data.glow}22`,
          display:"flex", flexDirection:"column", overflow:"hidden",
        }}>
          {/* Header */}
          <div style={{
            display:"flex", justifyContent:"space-between", alignItems:"flex-start",
            padding:16, borderBottom:"1px solid #1e293b", background:data.bg,
          }}>
            <div>
              <div style={{
                fontSize:13, fontWeight:700, fontFamily:"monospace",
                letterSpacing:2, color:data.textColor,
              }}>{data.title.toUpperCase()}</div>
              <div style={{
                fontSize:10, color:"#475569", fontFamily:"monospace", marginTop:2,
              }}>{data.subtitle}</div>
            </div>
            <button onClick={onClose} style={{
              background:"none", border:"none", cursor:"pointer",
              color:"#64748b", padding:2,
            }}><X size={16} /></button>
          </div>

          {/* Stats grid */}
          <div style={{
            display:"grid", gridTemplateColumns:"1fr 1fr", gap:8,
            padding:16, borderBottom:"1px solid #1e293b",
          }}>
            {data.stats.map(s => (
              <div key={s.label} style={{
                padding:8, borderRadius:6, background:data.bg,
                border:"1px solid #1e293b",
              }}>
                <div style={{
                  fontSize:15, fontWeight:700, fontFamily:"monospace",
                  color:data.textColor,
                }}>{s.value}</div>
                <div style={{
                  fontSize:9, color:"#475569", fontFamily:"monospace",
                  marginTop:2, letterSpacing:1,
                }}>{s.label.toUpperCase()}</div>
              </div>
            ))}
          </div>

          {/* Log */}
          <div style={{ flex:1, overflowY:"auto", padding:16 }}>
            <div style={{
              fontSize:9, fontWeight:600, fontFamily:"monospace",
              color:data.textColor, marginBottom:8, letterSpacing:3,
              display:"flex", alignItems:"center", gap:4,
            }}>
              <Activity size={10} /> ACTIVITY LOG
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {data.log.map((entry, i) => (
                <div key={i} style={{
                  fontSize:10, fontFamily:"monospace", color:"#94a3b8",
                  lineHeight:1.55, padding:"6px 8px", borderRadius:4,
                  border:"1px solid #1e293b", background:"rgba(15,23,42,.6)",
                  animation:`fadein .3s ease ${i * .06}s both`,
                }}>{entry}</div>
              ))}
            </div>
          </div>

          {/* Footer */}
          <div style={{
            padding:"8px 12px", borderTop:"1px solid #1e293b",
            display:"flex", justifyContent:"space-between", alignItems:"center",
          }}>
            <span style={{ fontSize:9, color:"#334155", fontFamily:"monospace" }}>
              SAMPLE DATA · v0.1
            </span>
            <div style={{ display:"flex", alignItems:"center", gap:5 }}>
              <div className="dot-pulse" style={{
                width:6, height:6, borderRadius:"50%", background:data.glow,
              }} />
              <span style={{ fontSize:9, fontFamily:"monospace", color:data.textColor }}>
                LIVE
              </span>
            </div>
          </div>
        </div>
      );
    }

    // ── Corridors ─────────────────────────────────────────────────────────────

    function Corridors({ activeRoom }) {
      return (
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{
          position:"absolute", inset:0, width:"100%", height:"100%",
          pointerEvents:"none", zIndex:1,
        }}>
          <defs>
            <filter id="gl" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="0.8" result="b" />
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          {ROOMS.map(room => {
            const on = room.id === activeRoom;
            return (
              <line key={room.id}
                x1={room.x} y1={room.y} x2={50} y2={50}
                stroke={on ? room.glow : "#1e293b"}
                strokeWidth={on ? .6 : .35}
                strokeDasharray={on ? "none" : "1.5,1.5"}
                filter={on ? "url(#gl)" : "none"}
                opacity={on ? .9 : .5}
              />
            );
          })}
        </svg>
      );
    }

    // ── Header ────────────────────────────────────────────────────────────────

    function Header({ activeRoom }) {
      const room = ROOMS.find(r => r.id === activeRoom);
      return (
        <div style={{
          display:"flex", flexWrap:"wrap", gap:8,
          justifyContent:"space-between", alignItems:"center",
          padding:"10px 20px", borderBottom:"1px solid #1e293b",
          background:"rgba(2,6,23,.9)", position:"relative", zIndex:20,
        }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div className="blink-orb" style={{
              width:8, height:8, borderRadius:"50%",
              background:"#6366f1", boxShadow:"0 0 8px #6366f1",
            }} />
            <span style={{
              fontSize:12, fontWeight:700, fontFamily:"monospace",
              color:"#cbd5e1", letterSpacing:4,
            }}>RACCOON QUANT CITADEL</span>
            <span style={{ fontSize:9, fontFamily:"monospace", color:"#334155" }}>v0.1</span>
          </div>
          <div style={{
            display:"flex", flexWrap:"wrap", gap:14, alignItems:"center",
            fontSize:9, fontFamily:"monospace", color:"#475569",
          }}>
            <span style={{ display:"flex", gap:3, alignItems:"center" }}>
              <TrendingUp size={9} /> DAY 47
            </span>
            <span style={{ display:"flex", gap:3, alignItems:"center", color:"#f59e0b" }}>
              <Zap size={9} /> LOUD_VIOLENT
            </span>
            <span style={{ display:"flex", gap:3, alignItems:"center" }}>
              <Archive size={9} /> AUDIT MODE
            </span>
            {room && (
              <span style={{ display:"flex", gap:3, alignItems:"center", color:"#818cf8" }}>
                <ChevronRight size={9} />{room.label.toUpperCase()}
              </span>
            )}
          </div>
        </div>
      );
    }

    // ── Legend ────────────────────────────────────────────────────────────────

    function Legend() {
      return (
        <div style={{
          position:"absolute", bottom:12, left:"50%", transform:"translateX(-50%)",
          zIndex:20, display:"flex", alignItems:"center", gap:8,
          background:"rgba(2,6,23,.85)", border:"1px solid #1e293b",
          borderRadius:6, padding:"5px 12px",
        }}>
          {CREATURES.map(c => (
            <div key={c.id} title={`${c.label} — ${c.status}`}
              style={{ display:"flex", alignItems:"center", gap:3 }}>
              <span style={{ fontSize:12 }}>{c.emoji}</span>
              <div style={{
                width:5, height:5, borderRadius:"50%",
                background:c.color, boxShadow:`0 0 4px ${c.color}`,
              }} />
            </div>
          ))}
          <span style={{
            fontSize:8, fontFamily:"monospace", color:"#334155", marginLeft:4,
          }}>COUNCIL</span>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────

    function RaccoonCitadel() {
      const [activeRoom, setActiveRoom] = useState(null);
      const toggle = id => setActiveRoom(prev => prev === id ? null : id);

      return (
        <div style={{
          width:"100%", height:"100%", display:"flex", flexDirection:"column",
          background:"#020617", color:"#f1f5f9", overflow:"hidden",
        }}>
          <Header activeRoom={activeRoom} />

          <div style={{ flex:1, position:"relative", overflow:"hidden" }}>
            {/* Background */}
            <div style={{
              position:"absolute", inset:0,
              background:"radial-gradient(ellipse 70% 60% at 50% 50%, #0f172a 0%, #020617 100%)",
            }} />

            {/* Grid */}
            <div style={{
              position:"absolute", inset:0, pointerEvents:"none", opacity:.04,
              backgroundImage:"linear-gradient(#94a3b8 1px,transparent 1px),linear-gradient(90deg,#94a3b8 1px,transparent 1px)",
              backgroundSize:"5% 5%",
            }} />

            {/* Corner glyphs */}
            {[{t:12,l:12},{t:12,r:12},{b:12,l:12},{b:12,r:12}].map((pos,i) => (
              <div key={i} style={{ position:"absolute", opacity:.3, ...pos }}>
                <HexGlyph color="#6366f1" size={32} />
              </div>
            ))}

            {/* Stone rings */}
            <div style={{
              position:"absolute", inset:32, borderRadius:"50%", pointerEvents:"none",
              border:"1px solid rgba(30,41,59,.4)",
              boxShadow:"inset 0 0 60px rgba(15,23,42,.5)",
            }} />
            <div style={{
              position:"absolute", inset:64, borderRadius:"50%", pointerEvents:"none",
              border:"1px solid rgba(30,41,59,.2)",
            }} />

            <Corridors activeRoom={activeRoom} />
            <SophonOrb />

            {ROOMS.map(room => (
              <RoomNode key={room.id} room={room}
                isActive={activeRoom === room.id}
                onClick={() => toggle(room.id)} />
            ))}

            <div style={{ position:"absolute", inset:0, pointerEvents:"none", zIndex:5 }}>
              {CREATURES.map(c => <Creature key={c.id} creature={c} />)}
            </div>

            <Legend />

            {activeRoom && (
              <SidePanel key={activeRoom} roomId={activeRoom}
                onClose={() => setActiveRoom(null)} />
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <React.StrictMode>
        <RaccoonCitadel />
      </React.StrictMode>
    );
  </script>
</body>
</html>
